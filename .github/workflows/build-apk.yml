name: Compilar APK

# Se ejecuta cada vez que subes cambios a main, o manualmente desde la pestaña "Actions"
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java (necesario para Android/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Añadir la plataforma Android (se genera de cero cada vez)
        run: npx cap add android

      - name: Agregar el plugin nativo FileSaver (para que Guardar/Exportar funcione dentro del APK)
        run: |
          mkdir -p android/app/src/main/java/com/paradiseshop/arqueostock
          cat > android/app/src/main/java/com/paradiseshop/arqueostock/MainActivity.java << 'EOF'
          package com.paradiseshop.arqueostock;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  // Los plugins deben registrarse ANTES de super.onCreate(), que es
                  // cuando Capacitor carga la página web. Así se garantiza que
                  // Capacitor.Plugins.FileSaver ya exista desde el primer instante,
                  // a diferencia de addJavascriptInterface, que llega tarde.
                  registerPlugin(FileSaverPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          cat > android/app/src/main/java/com/paradiseshop/arqueostock/FileSaverPlugin.java << 'EOF'
          package com.paradiseshop.arqueostock;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          // Plugin nativo de Capacitor que guarda archivos directamente en el
          // teléfono. Se llama desde JS como: Capacitor.Plugins.FileSaver.saveFile(...)
          // No depende de window.print() ni de navigator.share, que el WebView de la
          // app no soporta de forma confiable.
          @CapacitorPlugin(name = "FileSaver")
          public class FileSaverPlugin extends Plugin {

              @PluginMethod
              public void saveFile(PluginCall call) {
                  String base64Data = call.getString("data");
                  String filename = call.getString("filename");
                  String mimeType = call.getString("mimeType", "application/octet-stream");

                  if (base64Data == null || filename == null) {
                      call.reject("Faltan datos (data o filename)");
                      return;
                  }

                  try {
                      byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                      String rutaFinal;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.MediaColumns.DISPLAY_NAME, filename);
                          values.put(MediaStore.MediaColumns.MIME_TYPE, mimeType);
                          values.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/ArqueoStock");
                          Uri uri = getContext().getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri == null) throw new Exception("No se pudo crear el archivo en Descargas");
                          OutputStream out = getContext().getContentResolver().openOutputStream(uri);
                          if (out == null) throw new Exception("No se pudo abrir el archivo para escribir");
                          out.write(bytes);
                          out.close();
                          rutaFinal = "Descargas/ArqueoStock/" + filename;
                      } else {
                          File downloads = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          File dir = new File(downloads, "ArqueoStock");
                          if (!dir.exists()) dir.mkdirs();
                          File file = new File(dir, filename);
                          FileOutputStream out = new FileOutputStream(file);
                          out.write(bytes);
                          out.close();
                          rutaFinal = file.getAbsolutePath();
                      }

                      JSObject ret = new JSObject();
                      ret.put("path", rutaFinal);
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("Error al guardar: " + e.getMessage(), e);
                  }
              }
          }
          EOF

      - name: Generar el ícono de la app a partir de resources/icon.png
        run: npx @capacitor/assets generate --android

      - name: Sincronizar los archivos web con el proyecto Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar el APK (debug, instalable directamente)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ArqueoStock-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
