name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Agregar la plataforma Android
        run: npx cap add android

      - name: Sincronizar los archivos web
        run: npx cap sync android

      - name: Compilar el APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Ver qué se generó (diagnóstico)
        run: find android/app/build/outputs -type f 2>&1 || echo "No se encontró la carpeta outputs"

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: arqueo-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publicar el APK en "Releases" (descarga directa, sin descomprimir)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-compilacion
          name: "Última compilación"
          body: "APK generado automáticamente desde el código en main. Descarga el .apk aquí abajo."
          prerelease: true
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
