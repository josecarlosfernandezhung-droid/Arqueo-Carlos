name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Agregar la plataforma Android
        run: npx cap add android

      - name: Sincronizar los archivos web
        run: npx cap sync android

      - name: Compilar el APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: arqueo-apk
          path: android/app/build/outputs/apk/debug/app-debug.ap
