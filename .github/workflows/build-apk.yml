name: Compilar APK

# Se ejecuta cada vez que subes cambios a main, o manualmente desde la pestaña "Actions"
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java (necesario para Android/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Añadir la plataforma Android (se genera de cero cada vez)
        run: npx cap add android

      - name: Agregar el puente nativo AndroidSaver (para que Guardar/Exportar funcione dentro del APK)
        run: |
          mkdir -p android/app/src/main/java/com/paradiseshop/arqueostock
          cat > android/app/src/main/java/com/paradiseshop/arqueostock/MainActivity.java << 'EOF'
          package com.paradiseshop.arqueostock;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;

          import com.getcapacitor.BridgeActivity;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  this.bridge.getWebView().addJavascriptInterface(new AndroidSaver(this), "AndroidSaver");
              }

              // Puente que expone JS -> Java para guardar archivos directamente en el
              // teléfono, sin depender de window.print() ni de navigator.share, que el
              // WebView de la app no soporta de forma confiable.
              public static class AndroidSaver {
                  private final Context context;

                  AndroidSaver(Context context) {
                      this.context = context;
                  }

                  @JavascriptInterface
                  public void saveFile(String base64Data, String filename, String mimeType) {
                      try {
                          byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                          String mensaje;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.MediaColumns.DISPLAY_NAME, filename);
                              values.put(MediaStore.MediaColumns.MIME_TYPE, mimeType);
                              values.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/ArqueoStock");
                              Uri uri = context.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri == null) throw new Exception("No se pudo crear el archivo");
                              OutputStream out = context.getContentResolver().openOutputStream(uri);
                              if (out != null) {
                                  out.write(bytes);
                                  out.close();
                              }
                              mensaje = "Guardado en Descargas/ArqueoStock: " + filename;
                          } else {
                              File downloads = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              File dir = new File(downloads, "ArqueoStock");
                              if (!dir.exists()) dir.mkdirs();
                              File file = new File(dir, filename);
                              FileOutputStream out = new FileOutputStream(file);
                              out.write(bytes);
                              out.close();
                              mensaje = "Guardado en Descargas/ArqueoStock: " + filename;
                          }
                          final String msgFinal = mensaje;
                          ((Activity) context).runOnUiThread(() ->
                              Toast.makeText(context, "✅ " + msgFinal, Toast.LENGTH_LONG).show()
                          );
                      } catch (Exception e) {
                          final String error = e.getMessage();
                          ((Activity) context).runOnUiThread(() ->
                              Toast.makeText(context, "⚠️ Error al guardar: " + error, Toast.LENGTH_LONG).show()
                          );
                      }
                  }
              }
          }
          EOF

      - name: Generar el ícono de la app a partir de resources/icon.png
        run: npx @capacitor/assets generate --android

      - name: Sincronizar los archivos web con el proyecto Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar el APK (debug, instalable directamente)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ArqueoStock-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
