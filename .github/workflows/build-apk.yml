name: Compilar APK

# Se ejecuta cada vez que subes cambios a main, o manualmente desde la pestaña "Actions"
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java (necesario para Android/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Añadir la plataforma Android (se genera de cero cada vez)
        run: npx cap add android

      - name: Gener
      - name: Compilar el APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Ver qué se generó (diagnóstico)
        run: find android/app/build/outputs -type f 2>&1 || echo "No se encontró la carpeta outputs"

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: arqueo-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publicar el APK en "Releases" (descarga directa, sin descomprimir)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-compilacion
          name: "Última compilación"
          body: "APK generado automáticamente desde el código en main. Descarga el .apk aquí abajo."
          prerelease: true
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
