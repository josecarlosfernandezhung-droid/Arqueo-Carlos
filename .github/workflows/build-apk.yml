name: Compilar APK

# Se ejecuta cada vez que subes cambios a main, o manualmente desde la pestaña "Actions"
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java (necesario para Android/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Añadir la plataforma Android (se genera de cero cada vez)
        run: npx cap add android

      - name: Generar el ícono de la app a partir de resources/icon.png
        run: npx @capacitor/assets generate --android

      - name: Sincronizar los archivos web con el proyecto Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar el APK (debug, instalable directamente)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ArqueoStock-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
